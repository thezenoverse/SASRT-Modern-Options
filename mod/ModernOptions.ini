; Modern Options settings
[Layout]
; Compact menu layout (Controller Options, Display Options): the PC port draws it bigger than the
; Xbox 360 version. CompactScale shrinks its rows and text (1 = game default).
CompactScale=0.77
; 1 = remove the extra space the PC port adds between compact rows.
CompactSpacing=1
; Menu position animation (MENUPOS_GROUP "POS_n") for Controller Options. F6 / F7 step it.
ControllerMenuPos=0
